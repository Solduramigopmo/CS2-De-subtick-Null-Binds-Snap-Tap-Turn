// ЧТО ДЕЛАЕТ:
// • меняет laj_r на laj_l → меняет laj_l на laj_r


// ТАКЖЕ ИЗВЕСТНА КАК:
// • переключение инста-стрейфа ладдер-джампа, как в CS:GO (toggle CS:GO instastrafe bind for LAJ)
