/////////// § 1. ВАШИ НАСТРОЙКИ //////////////////////////////////////////////////////////////////////////////
//////////////////////////////////////////////////////////////////////////////////////////////////////////////

// Это место, куда вы можете сохранить свои прочие бинды и настройки CS2 (например: чувствительность мыши)
// Они будут применяться вместе с основным конфигом (аналог autoexec)

con_enable "true"
r_show_build_info "false"


// ———————————————————————————————————————————————————————————————————————————————————————————————————————————










//////////////////////////////////////////////////////////////////////////////////////////////////////////////
/////////// § 2. [ДЕ-САБТИК] НУЛЛЫ ///////////////////////////////////////////////////////////////////////////
//////////////////////////////////////////////////////////////////////////////////////////////////////////////

// ———————— 2.1.1 | НУЛЛЫ для ПРЕМЬЕРА/МАТЧМЕЙКИНГА (влево/вправо) ———————————————————————————————————————————

// ❌ ВНИМАНИЕ! Если вы поставите эти нуллы, у вас НЕ БУДУТ работать все остальные бинды!


// ЧТО ДЕЛАЮТ:
// • +a: отпускает D + нажимает A
// • +d: отпускает A + нажимает D
// • чуть хуже не дают одновременно зажимать влево и вправо (только последнее нажатое направление будет активным)


// ТАКЖЕ ИЗВЕСТНЫ КАК:
// • CS2 ван-кей (1key)
// • CS2 нули (nulls)
// • CS2 снап-тап (Snap Tap)
// • CS2 снапи-тапи (Snappy Tappy)
// • CS2 эс-оу-си-ди (SOCD)
// • +а (+a)
// • +д (+d)


// БИНДЫ ЗАДУМЫВАЛИСЬ:
// ✅ на нажатие/удержание кнопки клавиатуры/мыши
// ❌ на прокрутку колеса мыши

bind "" "+a"
bind "" "+d"
// ———————————————————————————————————————————————————————————————————————————————————————————————————————————





// ———————— 2.1.2 | НУЛЛЫ для ПРЕМЬЕРА/МАТЧМЕЙКИНГА (вперед/назад) ———————————————————————————————————————————

// ❌ ВНИМАНИЕ! Если вы поставите эти нуллы, у вас НЕ БУДУТ работать все остальные бинды!


// ЧТО ДЕЛАЮТ:
// • +w: отпускает S + нажимает W
// • +s: отпускает W + нажимает S
// • чуть хуже не дают одновременно зажимать вперед и назад (только последнее нажатое направление будет активным)


// ТАКЖЕ ИЗВЕСТНЫ КАК:
// • CS2 ван-кей (1key)
// • CS2 нули (nulls)
// • CS2 снап-тап (Snap Tap)
// • CS2 снапи-тапи (Snappy Tappy)
// • CS2 эс-оу-си-ди (SOCD)
// • +в (+w)
// • +с (+s)


// БИНДЫ ЗАДУМЫВАЛИСЬ:
// ✅ на нажатие/удержание кнопки клавиатуры/мыши
// ❌ на прокрутку колеса мыши

bind "" "+w"
bind "" "+s"
// ———————————————————————————————————————————————————————————————————————————————————————————————————————————





// ———————— 2.2.1 | САМЫЕ БЫСТРЫЕ и ТОЧНЫЕ НУЛЛЫ (влево/вправо) ——————————————————————————————————————————————

// ЧТО ДЕЛАЮТ:
// • +mlwd: отпускает D + нажимает A
// • +mrwd: отпускает A + нажимает D
// • не дают одновременно зажимать влево и вправо (только последнее нажатое направление будет активным)


// ТАКЖЕ ИЗВЕСТНЫ КАК:
// • CS:GO ван-кей (1key)
// • CS:GO нули (nulls)
// • CS:GO снап-тап (Snap Tap)
// • CS:GO снапи-тапи (Snappy Tappy)
// • CS:GO эс-оу-си-ди (SOCD)
// • +млефт (+mleft)
// • +мрайт (+mright)


// БИНДЫ ЗАДУМЫВАЛИСЬ:
// ✅ на нажатие/удержание кнопки клавиатуры/мыши
// ❌ на прокрутку колеса мыши

bind "a" "+mlwd"
bind "d" "+mrwd"
// ———————————————————————————————————————————————————————————————————————————————————————————————————————————





// ———————— 2.2.2 | САМЫЕ БЫСТРЫЕ и ТОЧНЫЕ НУЛЛЫ (вперед/назад) ——————————————————————————————————————————————

// ЧТО ДЕЛАЮТ:
// • +mfwd: отпускает S + нажимает W
// • +mbwd: отпускает W + нажимает S
// • не дают одновременно зажимать вперед и назад (только последнее нажатое направление будет активным)


// ТАКЖЕ ИЗВЕСТНЫ КАК:
// • CS:GO ван-кей (1key)
// • CS:GO нули (nulls)
// • CS:GO снап-тап (Snap Tap)
// • CS:GO снапи-тапи (Snappy Tappy)
// • CS:GO эс-оу-си-ди (SOCD)
// • +мфвд (+mfwd)
// • +мбэк (+mback)


// БИНДЫ ЗАДУМЫВАЛИСЬ:
// ✅ на нажатие/удержание кнопки клавиатуры/мыши
// ❌ на прокрутку колеса мыши

bind "w" "+mfwd"
bind "s" "+mbwd"
// ———————————————————————————————————————————————————————————————————————————————————————————————————————————










