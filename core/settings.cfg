// ———————— 3.1.1 | ЛОНГ-ДЖАМП (без приседа, передом/задом) ——————————————————————————————————————————————————

// ЧТО ДЕЛАЕТ:
// • отпускает W + отпускает S + прыгает


// ТАКЖЕ ИЗВЕСТЕН КАК:
// • минус W и S, как в CS:GO (CS:GO W & S release bind)
// • +лжнб (+ljnb)
//
// • CS2 лонг-джамп на колесико (CS2 scroll longjump bind)
// • +лжнб_в (+ljnb_w)


// БИНД ЗАДУМЫВАЛСЯ:
// ✅ на нажатие/удержание кнопки клавиатуры/мыши
// ✅ на прокрутку колеса мыши

bind "" "+lj"
// ———————————————————————————————————————————————————————————————————————————————————————————————————————————





// ———————— 3.1.2 | ЛОНГ-ДЖАМП (с приседом, передом/задом) ———————————————————————————————————————————————————

// ЧТО ДЕЛАЕТ:
// • отпускает W + отпускает S + прыгает + присаживается


// ТАКЖЕ ИЗВЕСТЕН КАК:
// • минус W и S с приседом, как в CS:GO (CS:GO W & S release bind with duck)
// • +лж (+lj)


// БИНД ЗАДУМЫВАЛСЯ:
// ✅ на нажатие/удержание кнопки клавиатуры/мыши
// ❌ на прокрутку колеса мыши

bind "" "+ldj"
// ———————————————————————————————————————————————————————————————————————————————————————————————————————————





// ———————— 3.2.1 | SIDEWAYS ЛОНГ-ДЖАМП (без приседа, левый/правый) ——————————————————————————————————————————

// ЧТО ДЕЛАЕТ:
// • отпускает A + отпускает D + прыгает


// ТАКЖЕ ИЗВЕСТЕН КАК:
// • минус W и S для прыжков боком, как в CS:GO (CS:GO sideways W & S release bind)
// • +лжнб для прыжков боком (sideways +ljnb)
//
// • CS2 лонг-джамп на колесико для прыжков боком (CS2 sideways scroll longjump bind)
// • +лжнб_в для прыжков боком (sideways +ljnb_w)


// БИНД ЗАДУМЫВАЛСЯ:
// ✅ на нажатие/удержание кнопки клавиатуры/мыши
// ✅ на прокрутку колеса мыши

bind "" "+lj_sw"
// ———————————————————————————————————————————————————————————————————————————————————————————————————————————





// ———————— 3.2.2 | SIDEWAYS ЛОНГ-ДЖАМП (с приседом, левый/правый) ———————————————————————————————————————————

// ЧТО ДЕЛАЕТ:
// • отпускает A + отпускает D + прыгает + присаживается


// ТАКЖЕ ИЗВЕСТЕН КАК:
// • минус W и S с приседом для прыжков боком, как в CS:GO (CS:GO sideways W & S release bind with duck)
// • +лж для прыжков боком (sideways +lj)


// БИНД ЗАДУМЫВАЛСЯ:
// ✅ на нажатие/удержание кнопки клавиатуры/мыши
// ❌ на прокрутку колеса мыши

bind "" "+ldj_sw"
// ———————————————————————————————————————————————————————————————————————————————————————————————————————————





// ———————— 3.3.1 | ПОЛУАВТОМАТИЧЕСКИЙ 99% ЛОНГ-КРАУЧ-ДЖАМП (с движением мыши, передом/задом) ————————————————

// ЧТО ДЕЛАЕТ:
// • присаживается → *двигаете мышью* → отпускает W + отпускает S + прыгает


// ТАКЖЕ ИЗВЕСТЕН КАК:
// • CS2 минус W и S с 99% прыжком на 66 высоту (CS2 W & S release bind with 99% 66 height jump)
// • CS2 минус W и S с 99% краучем (CS2 W & S release bind with 99% crouch)
// • +лжкж (+ljcj)


// БИНД ЗАДУМЫВАЛСЯ:
// ✅ на нажатие/удержание кнопки клавиатуры/мыши
// ❌ на прокрутку колеса мыши

bind "" "+lscj"
// ———————————————————————————————————————————————————————————————————————————————————————————————————————————





// ———————— 3.3.2 | АВТОМАТИЧЕСКИЙ 100% ЛОНГ-КРАУЧ-ДЖАМП (БЕЗ ДВИЖЕНИЯ МЫШИ, передом/задом) ——————————————————

// ЧТО ДЕЛАЕТ:
// • присаживается → отпускает W + отпускает S + прыгает


// ТАКЖЕ ИЗВЕСТЕН КАК:
// • CS2 минус W и S со 100% прыжком на 66 высоту (CS2 W & S release bind with 100% 66 height jump)
// • CS2 минус W и S со 100% краучем (CS2 W & S release bind with 100% crouch)
// • +лжкж (+ljcj)


// БИНД ЗАДУМЫВАЛСЯ:
// ✅ на нажатие/удержание кнопки клавиатуры/мыши
// ❌ на прокрутку колеса мыши

bind "" "+lcj"
// ———————————————————————————————————————————————————————————————————————————————————————————————————————————





// ———————— 3.4.1 | ПОЛУАВТОМАТИЧЕСКИЙ 99% КРАУЧ-ДЖАМП (с движением мыши, во все стороны) ————————————————————

// ЧТО ДЕЛАЕТ:
// • присаживается → *двигаете мышью* → прыгает


// ТАКЖЕ ИЗВЕСТЕН КАК:
// • CS2 99% прыжок на 66 высоту (CS2 99% 66 height jump bind)
// • CS2 99% крауч (CS2 99% crouch bind)
// • +кж (+cj)


// БИНД ЗАДУМЫВАЛСЯ:
// ✅ на нажатие/удержание кнопки клавиатуры/мыши
// ❌ на прокрутку колеса мыши

bind "" "+scj"
// ———————————————————————————————————————————————————————————————————————————————————————————————————————————





// ———————— 3.4.2 | АВТОМАТИЧЕСКИЙ 100% КРАУЧ-ДЖАМП (БЕЗ ДВИЖЕНИЯ МЫШИ, во все стороны) ——————————————————————

// ЧТО ДЕЛАЕТ:
// • присаживается → прыгает


// ТАКЖЕ ИЗВЕСТЕН КАК:
// • CS2 100% прыжок на 66 высоту (CS2 100% 66 height jump bind)
// • CS2 100% крауч (CS2 100% crouch bind)
// • +кж (+cj)


// БИНД ЗАДУМЫВАЛСЯ:
// ✅ на нажатие/удержание кнопки клавиатуры/мыши
// ❌ на прокрутку колеса мыши

bind "" "+cj"
// ———————————————————————————————————————————————————————————————————————————————————————————————————————————










